[project]
name = "spotify-mcp"
version = "0.1.0"
description = "A minimal FastMCP server for the Spotify catalog"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.0.5",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
